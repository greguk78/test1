# Szablon nginx dla statycznej wersji (npm run build -> dist/ skopiowany do /var/www/portfolio).
# sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
# sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;                 # albo Twoja domena / adres w sieci lokalnej
    root /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # zmniejszone zdjęcia: długi cache w przeglądarce
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # dane portfolio: zawsze świeże
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}

